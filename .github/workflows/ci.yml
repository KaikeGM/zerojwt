name: CI & Zero-Alloc Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x' ]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Static Analysis (go vet)
        run: |
          go vet ./...
          (cd v2 && go vet ./...)

      - name: Enforce Strict Zero Heap Allocations (0 B/op, 0 allocs/op)
        run: |
          go test -v -run=TestZeroAllocations ./...
          (cd v2 && go test -v -run=TestZeroAllocations ./...)

      - name: Run Full Test Suite & Race Detector
        run: |
          go test -v -race ./...
          (cd v2 && go test -v -race ./...)

      - name: Run Zero-Alloc Benchmarks
        run: |
          go test -bench=. -benchmem ./...
          (cd v2 && go test -bench=. -benchmem ./...)

  test-linux-arm64:
    name: Test (Linux arm64, Go 1.23)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Run Tests in Linux ARM64 Container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/app \
            -w /app \
            golang:1.27 \
            bash -c "go test -v ./... && (cd v2 && go test -v ./...) && go test -v -run=TestZeroAllocations ./... && (cd v2 && go test -v -run=TestZeroAllocations ./...)"

  coverage:
    name: Code Quality & 100% Statement Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Verify Code Formatting (gofmt)
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "SUCCESS: All Go source files adhere to gofmt formatting standards."

      - name: Run Coverage Analysis (Root v1)
        run: go test -v -coverprofile=coverage_v1.out ./...

      - name: Enforce 100.0% Coverage Threshold (Root v1)
        shell: bash
        run: |
          TOTAL_COV=$(go tool cover -func=coverage_v1.out | grep "total:" | awk '{print $3}')
          echo "Total Statement Coverage (v1): $TOTAL_COV"
          if [ "$TOTAL_COV" != "100.0%" ]; then
            echo "ERROR: Code coverage dropped below 100.0% on v1! Found: $TOTAL_COV"
            exit 1
          fi
          echo "SUCCESS: Code coverage is exactly 100.0% across all statements on v1."

      - name: Run Coverage Analysis (Module v2)
        working-directory: ./v2
        run: go test -v -coverprofile=coverage_v2.out ./...

      - name: Enforce 100.0% Coverage Threshold (Module v2)
        shell: bash
        working-directory: ./v2
        run: |
          TOTAL_COV=$(go tool cover -func=coverage_v2.out | grep "total:" | awk '{print $3}')
          echo "Total Statement Coverage (v2): $TOTAL_COV"
          if [ "$TOTAL_COV" != "100.0%" ]; then
            echo "ERROR: Code coverage dropped below 100.0% on v2! Found: $TOTAL_COV"
            exit 1
          fi
          echo "SUCCESS: Code coverage is exactly 100.0% across all statements on v2."

      - name: Upload Coverage Profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage_v1.out
            v2/coverage_v2.out
          retention-days: 14
